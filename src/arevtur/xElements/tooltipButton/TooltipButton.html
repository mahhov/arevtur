<style>
	@import '../sharedStyle.css';

	:host {
		display: inline-block;
	}

	.container {
		display: contents;
	}

	/* todo[medium] outline is still visible */
	.container:has(button:empty) {
		display: none;
	}

	#tooltip-wrapper {
		position: fixed;
		background: var(--back);
		border: 2px solid var(--interactable-focus-border);
		display: flex;
		z-index: 1;
		font-size: 14px;
		padding: 5px;
		min-width: 300px;
		width: max-content;
		overflow-y: auto;
	}

	#tooltip {
		flex: 1;
	}

	#tooltip-right {
		flex: 1;
		border-left: 2px solid var(--interactable-focus-border);
		padding-left: 5px;
		margin-left: 5px;
	}

	.container:not(:hover) #tooltip-wrapper, #tooltip-wrapper:not([data-visible]) {
		display: none;
	}

	#tooltip-right:not([text]), #tooltip-right[text=''] {
		display: none;
	}
</style>

<div class="container">
	<button id="button"></button>
	<div id="tooltip-wrapper">
		<x-formatted-text id="tooltip"></x-formatted-text>
		<x-formatted-text id="tooltip-right"></x-formatted-text>
	</div>
</div>
