<style>
	@import '../sharedStyle.css';

	:host {
		height: 450px;
		padding: 10px;
		border: 1px solid var(--interactable-border);
		background-color: var(--interactable-back);

		display: flex;
		flex-direction: column;
		gap: 10px;
	}

	:host(.selected) {
		background: var(--interactable-active-back);
	}

	:host(.hovered) {
		background: var(--interactable-hover-back);
	}

	.scroll {
		overflow: auto;
		flex: 1 1 0;
	}

	.button-pane {
		flex: 0 0;
		position: relative;
	}

	.small-info {
		font-size: 12px;
		overflow: hidden;
	}

	#account-text {
		overflow: hidden;
		text-wrap: nowrap;
		text-overflow: ellipsis;
	}

	.debug {
		flex: 0 0;
		position: relative;
	}
</style>

<div id="name-text"></div>

<x-formatted-text id="body" class="scroll"></x-formatted-text>

<div class="button-pane">
	<!-- todo[medium] show pob value without need to hover -->
	<div>
		<x-tooltip-button id="weight-value"></x-tooltip-button>
		<x-tooltip-button id="build-value" class="pob"></x-tooltip-button>
		<x-tooltip-button id="craft-value" class="pob"></x-tooltip-button>
	</div>
	<div>
		<x-tooltip-button id="price"></x-tooltip-button>
	</div>
	<div>
		<button id="direct-whisper">Direct whisper</button>
		<button id="copy-whisper">Copy whisper</button>
		<button id="copy-item-button">Copy item</button>
	</div>
</div>

<div class="small-info">
	<x-formatted-text id="account-text" class="scroll"></x-formatted-text>
	<button id="refresh-button">Refresh</button>
</div>

<div class="debug experimental">
	<x-tooltip-button id="debug"></x-tooltip-button>
</div>
