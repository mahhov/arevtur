<style>
	@import '../themeStyle.css';
	@import '../sharedStyle.css';

	body {
		border: 1px solid;
		margin: 2px;
	}

	#container {
		display: block;
		max-height: 100%;
		overflow: auto;
		font-size: 14px;
	}

	#container > x-formatted-text {
		display: block;
		padding: 8px;
	}

	#container > x-formatted-text:not(.hidden) {
		/*border-bottom: 1px solid white;*/
	}
</style>

<script type="module">
	require('../arevtur/xElements/import');
</script>

<div id="container"></div>

<script type="module">
	require('../services/logging');
	const {keyHook, keySender, frontWindowTitle} = require('js-desktop-base');
	const {ipcRenderer, clipboard: electronClipboard} = require('electron');
	const configForRenderer = require('../services/config/configForRenderer');
	const Pricer = require('../services/pricer/Pricer');
	const Pricer2 = require('../services/pricer/Pricer2');
	const pobApi = require('../services/pobApi/pobApi');
	const appData = require('../services/appData');
	const {XElement} = require('xx-element');
	const {sleep, updateElementChildren} = require('../util/util');

	const $ = document.querySelector.bind(document);

	let slashType = name =>
		keySender.strings([keySender.TYPE, '{ctrl}{shift}{enter}/' + name + '{enter}']);

	let processClipboard = itemText => {
		console.debug('processClipboard:', itemText);
		if (!itemText) return;
		let P = configForRenderer.config.version2 ? Pricer2 : Pricer;
		let promises = [...P.getPrices(itemText), pobApi.evalItem(itemText).then(output => output.text)];

		updateElementChildren($('#container'), promises,
			() => document.createElement('x-formatted-text'),
			async (el, i, promise) => {
				el.text = 'pending';
				el.classList.remove('hidden');
				try {
					el.text = (await promise);
				} catch (e) {
					el.classList.add('hidden');
					console.error(e);
				}
			});

		console.debug('show');
		ipcRenderer.invoke('key-snippet', 'show');
	};

	let windowCheck = async () => {
		if (!configForRenderer.config.restrictToPoeWindow)
			return true;
		let title = (await frontWindowTitle.get()).out.toLowerCase().trim();
		return ['path of exile', 'path of exile 2'].includes(title);
	};

	let addPoeShortcutListener = (key, shift, handler, ignoreWindow = false) =>
		keyHook.addShortcut(shift ? '{ctrl}{shift}' : '{ctrl}', key, async () => {
			console.debug('Key received', key);
			if (ignoreWindow || await windowCheck())
				handler();
			else
				console.debug('PoE window not focused.');
		});

	let init = () => {
		// todo[low] key sending seems to freeze the machine on linux
		addPoeShortcutListener('h', true, () => slashType('hideout'));
		addPoeShortcutListener('c', false, async () => {
			let oldClipboard = electronClipboard.readText();
			let clipboard = oldClipboard;
			let i;
			for (i = 0; i < 20 && oldClipboard === clipboard; i++, clipboard = electronClipboard.readText())
				await sleep(10);
			console.debug('slept for ', i * 10);
			if (clipboard)
				processClipboard(clipboard);
		});

		setupPobApi();
		configForRenderer.addListener('change', config => setupPobApi());
	};

	let setupPobApi = () => pobApi.setParams(configForRenderer.config.buildParams);

	document.addEventListener('mousedown', e =>
		ipcRenderer.invoke('key-snippet', e.button ? 'close' : 'prevent-close'));

	init();

	// todo[blocking] dev options
</script>
